    content:
      en:
        title: "Task Manager API"
        type: "Backend case study"
        summary: "An API-first productivity service focused on clean resource boundaries, validation, and predictable persistence."
        long_description: "Task Manager API is a backend case study for organizing productivity workflows around explicit contracts, validation, and clear state transitions. The dummy detail content is ready to be replaced with repository, endpoint, and deployment information."
        problem: "Task workflows need reliable state transitions, clear contracts, and data models that stay easy to evolve."
        role: "Modeled the API surface, persistence flow, and service boundaries."
        decisions:
          - "Separated validation, business rules, and data access concerns."
          - "Used explicit workflow transitions to keep application behavior understandable."
          - "Prepared the structure for automated tests and CI-friendly delivery."
        outcome: "A backend reference project that demonstrates practical .NET architecture and maintainable API design."
        features:
          - "Task and workflow resource modeling"
          - "Validation-oriented API boundaries"
          - "Persistence structure prepared for automated testing"
        learnings:
          - "Explicit transitions make backend behavior easier to document and test."
        future_improvements:
          - "Add OpenAPI documentation and a hosted demo."
          - "Publish repository and CI status links."
        legal:
          privacy:
            title: "Privacy Policy"
            body:
              - "This placeholder policy is prepared for a future Task Manager API deployment."
              - "Replace it with real data handling details before collecting user information."
          terms:
            title: "Terms of Use"
            body:
              - "These placeholder terms are prepared for future API usage rules."
              - "Replace them before offering a public service or demo."
      tr:
        title: "Task Manager API"
        type: "Backend vaka calismasi"
        summary: "Temiz kaynak sinirlari, dogrulama ve ongorulebilir veri akisi uzerine kurulu API odakli uretkenlik servisi."
        long_description: "Task Manager API; acik sozlesmeler, dogrulama ve net durum gecisleri etrafinda uretkenlik akislarini modelleyen bir backend vaka calismasidir. Yer tutucu detay icerigi daha sonra repo, endpoint ve yayin bilgileriyle degistirilebilir."
        problem: "Gorev akislari guvenilir durum gecislerine, net sozlesmelere ve kolay evrilen veri modellerine ihtiyac duyar."
        role: "API yuzeyi, kalicilik akisi ve servis sinirlarini modelleme."
        decisions:
          - "Dogrulama, is kurallari ve veri erisimi sorumluluklari ayrildi."
          - "Uygulama davranisini anlasilir tutmak icin acik is akisi gecisleri kullanildi."
          - "Otomatik testler ve CI uyumlu teslim icin yapi hazirlandi."
        outcome: "Pratik .NET mimarisini ve surdurulebilir API tasarimini gosteren bir backend referans projesi."
        features:
          - "Gorev ve akis kaynak modellemesi"
          - "Dogrulama odakli API sinirlari"
          - "Otomatik testlere hazir kalicilik yapisi"
        learnings:
          - "Acik gecisler backend davranisini belgelemeyi ve test etmeyi kolaylastirir."
        future_improvements:
          - "OpenAPI dokumantasyonu ve yayindaki demo eklemek."
          - "Repo ve CI durumu baglantilarini yayinlamak."
        legal:
          privacy:
            title: "Gizlilik Politikasi"
            body:
              - "Bu yer tutucu politika gelecekteki Task Manager API yayini icin hazirlandi."
              - "Kullanici bilgisi toplanmadan once gercek veri isleme detaylariyla degistirilmelidir."
          terms:
            title: "Kullanim Sartlari"
            body:
              - "Bu yer tutucu sartlar gelecekteki API kullanim kurallari icin hazirlandi."
              - "Herkese acik servis veya demo sunmadan once degistirilmelidir."

