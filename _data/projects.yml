    content:
      en:
        title: "E-Commerce Flow"
        type: "Full-stack case study"
        summary: "A product discovery and ordering flow concept connecting React UI patterns with backend data and transaction boundaries."
        long_description: "E-Commerce Flow explores how catalog browsing, basket decisions, and order boundaries can be presented as a coherent full-stack product flow. The current content is dummy detail data that can later become a full case study."
        problem: "Commerce interfaces need fast discovery, clear UI state, and backend contracts that keep frontend complexity under control."
        role: "Planned user flows, component structure, API needs, and ownership boundaries."
        decisions:
          - "Separated catalog, basket, and order concerns to avoid tightly coupled state."
          - "Kept reusable UI sections focused on decision support rather than decoration."
          - "Defined extension points for authentication, payments, and order history."
        outcome: "A full-stack case study ready to be connected to a repository, demo, and richer product narrative."
        features:
          - "Catalog, basket, and order flow separation"
          - "Frontend state mapped to backend ownership boundaries"
          - "Room for authentication, payment, and order history extensions"
        learnings:
          - "Commerce UI stays calmer when backend contracts are explicit."
        future_improvements:
          - "Add interactive prototype screenshots."
          - "Connect a live demo and repository."
        legal:
          privacy:
            title: "Privacy Policy"
            body:
              - "This placeholder privacy policy is prepared for a future commerce demo."
              - "Replace this content with real data, checkout, and account handling information."
          terms:
            title: "Terms of Use"
            body:
              - "These placeholder terms are prepared for future commerce demo usage."
              - "Replace this content before enabling real transactions or user accounts."
      tr:
        title: "E-Ticaret Akisi"
        type: "Full-stack vaka calismasi"
        summary: "React arayuz kaliplarini backend veri ve islem sinirlariyla baglayan urun kesfi ve siparis akisi konsepti."
        long_description: "E-Ticaret Akisi; katalog gezme, sepet kararlari ve siparis sinirlarinin tutarli bir full-stack urun akisi olarak nasil sunulabilecegini inceler. Mevcut icerik daha sonra tam bir vaka calismasina donusebilecek dummy detay verisidir."
        problem: "E-ticaret arayuzleri hizli kesif, net UI state yonetimi ve frontend karmasikligini kontrol altinda tutan backend sozlesmeleri ister."
        role: "Kullanici akislari, component yapisi, API ihtiyaclari ve sahiplik sinirlarini planlama."
        decisions:
          - "Catalog, sepet ve siparis sorumluluklari ayrilarak siki bagli state yapisi onlendi."
          - "Yeniden kullanilabilir arayuz bolumleri dekorasyon yerine karar destegine odaklandi."
          - "Kimlik dogrulama, odeme ve siparis gecmisi icin genisleme noktalari tanimlandi."
        outcome: "Repo, demo ve daha zengin urun anlatimiyla guclendirilmeye hazir bir full-stack vaka calismasi."
        features:
          - "Katalog, sepet ve siparis akis ayrimi"
          - "Frontend state yapisinin backend sahiplik sinirlarina baglanmasi"
          - "Kimlik, odeme ve siparis gecmisi icin genisleme alani"
        learnings:
          - "Backend sozlesmeleri acik oldugunda e-ticaret arayuzu daha sakin kalir."
        future_improvements:
          - "Etkilesimli prototip ekran goruntuleri eklemek."
          - "Canli demo ve repo baglantisi eklemek."
        legal:
          privacy:
            title: "Gizlilik Politikasi"
            body:
              - "Bu yer tutucu gizlilik politikasi gelecekteki e-ticaret demosu icin hazirlandi."
              - "Gercek veri, odeme ve hesap isleme bilgileriyle degistirilmelidir."
          terms:
            title: "Kullanim Sartlari"
            body:
              - "Bu yer tutucu sartlar gelecekteki e-ticaret demosu kullanimi icin hazirlandi."
              - "Gercek islem veya kullanici hesabi acilmadan once degistirilmelidir."
