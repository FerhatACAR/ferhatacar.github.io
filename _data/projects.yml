    content:
      en:
        title: "OptionDrop"
        type: "Mobile app MVP"
        summary: "An offline Flutter app that makes everyday decisions faster with custom option lists and simple random tools."
        long_description: "OptionDrop helps people move past small everyday decisions without creating an account or sending data to a server. Users can save their own option lists, make a random selection, and use built-in coin flip, dice, random number, and yes/no tools whenever a list is unnecessary."
        problem: "Small decisions can create unnecessary friction, while lightweight utility apps often introduce accounts, advertising, tracking, or network dependencies that the task does not need."
        role: "Designed and built the Flutter MVP, including local persistence, decision flows, reusable tools, settings, and privacy-first product boundaries."
        decisions:
          - "Kept the app fully offline with no backend, accounts, analytics, advertising, or device permissions."
          - "Stored lists, theme preferences, and selection history locally with shared_preferences."
          - "Separated list management, random pickers, quick tools, history, and settings into focused application areas."
        outcome: "A focused Android-ready tools MVP for fast, explainable decisions with a low-risk Google Play closed-testing scope."
        features:
          - "Create, edit, and delete personal option lists"
          - "Pick randomly from lists containing at least two options"
          - "Save selection results to on-device history"
          - "Use coin flip, dice, random number, and yes/no quick tools"
          - "Choose light, dark, or system theme"
        learnings:
          - "A small utility app can feel trustworthy when its data boundaries are explicit and its core flow works without a network connection."
        future_improvements:
          - "Add optional list backup and restore while preserving the local-first privacy model."
          - "Publish the closed-test build and connect its Google Play listing when available."
        legal:
          privacy:
            title: "Privacy Policy"
            body:
              - "OptionDrop does not collect, transmit, sell, or share personal data. It does not use accounts, analytics SDKs, advertising SDKs, Firebase, a backend API, or push notifications."
              - "Option lists, theme preferences, and selection history are stored only on the user's device through local app storage. Removing the app or clearing its storage may remove this information."
              - "The app does not request access to the camera, microphone, location, contacts, or advertising identifier."
          terms:
            title: "Terms of Use"
            body:
              - "OptionDrop is provided as a simple offline decision-support tool. Random selections and quick-tool results are for convenience and entertainment and should not be used as professional, legal, medical, financial, or safety advice."
              - "Users are responsible for the option lists they create and for decisions made using the app. The application is provided without a guarantee of uninterrupted availability or fitness for a particular purpose."
      tr:
        title: "OptionDrop"
        type: "Mobil uygulama MVP"
        summary: "Gunluk kucuk kararlari, kisisel secenek listeleri ve pratik rastgele araclarla hizlandiran offline Flutter uygulamasi."
        long_description: "OptionDrop, hesap olusturmadan veya veriyi bir sunucuya gondermeden gunluk karar vermeyi kolaylastirir. Kullanici kendi secenek listelerini kaydedebilir, bu listelerden rastgele secim yapabilir ya da liste gerektirmeyen durumlarda yazi-tura, zar, rastgele sayi ve evet/hayir araclarini kullanabilir."
        problem: "Kucuk kararlar gereksiz surtmeye yol acabilir; buna karsin hafif arac uygulamalari bile cogu zaman hesap, reklam, takip veya ag bagimliligi ekler."
        role: "Flutter MVP'sini; yerel veri saklama, karar akislari, tekrar kullanilabilir araclar, ayarlar ve gizlilik odakli urun sinirlariyla tasarlama ve gelistirme."
        decisions:
          - "Uygulama backend, hesap, analiz, reklam ve cihaz izni olmadan tamamen offline tutuldu."
          - "Liste, tema tercihi ve secim gecmisi shared_preferences ile yalnizca cihazda saklandi."
          - "Liste yonetimi, rastgele secim, hizli araclar, gecmis ve ayarlar odakli uygulama alanlarina ayrildi."
        outcome: "Hizli ve aciklanabilir kararlar icin, Google Play closed testing kapsaminda dusuk riskli Android hazirlikli bir Tools MVP'si."
        features:
          - "Kisisel secenek listeleri olusturma, duzenleme ve silme"
          - "En az iki secenekli listelerden rastgele secim yapma"
          - "Secim sonuclarini cihazdaki gecmise kaydetme"
          - "Yazi-tura, zar, rastgele sayi ve evet/hayir hizli araclari"
          - "Acik, koyu ve sistem tema destegi"
        learnings:
          - "Veri sinirlari acik oldugunda ve temel akis internetsiz calistiginda kucuk bir arac uygulamasi daha guvenilir hissedebilir."
        future_improvements:
          - "Yerel-oncelikli gizlilik modelini koruyarak istege bagli liste yedekleme ve geri yukleme eklemek."
          - "Closed test surumunu yayinlamak ve kullanilabilir oldugunda Google Play sayfasini baglamak."
        legal:
          privacy:
            title: "Gizlilik Politikasi"
            body:
              - "OptionDrop kisisel veri toplamaz, iletmez, satmaz veya paylasmaz. Uygulama hesap, analiz SDK'si, reklam SDK'si, Firebase, backend API ya da push notification kullanmaz."
              - "Secenek listeleri, tema tercihleri ve secim gecmisi yalnizca yerel uygulama depolamasi ile kullanicinin cihazinda tutulur. Uygulamanin silinmesi veya uygulama verilerinin temizlenmesi bu bilgileri silebilir."
              - "Uygulama kamera, mikrofon, konum, rehber veya reklam kimligi erisimi istemez."
          terms:
            title: "Kullanim Sartlari"
            body:
              - "OptionDrop basit bir offline karar destek araci olarak sunulur. Rastgele secimler ve hizli arac sonuclari kolaylik ve eglence amaclidir; profesyonel, hukuki, tibbi, finansal veya guvenlik tavsiyesi olarak kullanilmamalidir."
              - "Kullanicilar olusturduklari secenek listelerinden ve uygulama ile verdikleri kararlardan sorumludur. Uygulama kesintisiz erisim veya belirli bir amaca uygunluk garantisi olmadan sunulur."
