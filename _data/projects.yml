      en:
        title: "Portfolio Platform"
        type: "Personal product"
        summary: "A bilingual GitHub Pages portfolio designed as a maintainable content platform rather than a one-off static page."
        long_description: "This portfolio is structured as a lightweight content platform for projects, CV updates, technical writing, and bilingual search visibility. The goal is to make engineering depth easy to scan while keeping publishing simple through GitHub Pages."
        problem: "The previous site did not communicate engineering depth, technical writing, or search intent clearly enough."
        role: "Designed the information architecture, content model, UI system, bilingual routing, and SEO foundation."
        decisions:
          - "Kept GitHub Pages and Jekyll for fast publishing with minimal operational overhead."
          - "Moved reusable content into YAML so profile, projects, skills, and navigation can evolve without layout rewrites."
          - "Built language-aware routes and metadata for English and Turkish discovery."
        outcome: "A portfolio foundation that can scale with case studies, CV updates, and a growing technical blog."
        features:
          - "Bilingual English and Turkish content"
          - "Reusable YAML-backed project and profile sections"
          - "SEO-ready metadata and structured routing"
        learnings:
          - "Static sites can stay maintainable when content and presentation are separated early."
        future_improvements:
          - "Replace placeholder screenshots with production project captures."
          - "Connect richer case studies and downloadable assets."
        legal:
          privacy:
            title: "Privacy Policy"
            body:
              - "This placeholder privacy policy explains where project-specific privacy content will live."
              - "No real analytics, account data, or personal project data collection is described here yet."
          terms:
            title: "Terms of Use"
            body:
              - "These placeholder terms reserve a place for project-specific usage rules."
              - "Replace this text before connecting a real public application."
      tr:
        title: "Portfolyo Platformu"
        type: "Kisisel urun"
        summary: "Tek seferlik statik sayfa yerine surdurulebilir bir icerik platformu gibi tasarlanmis iki dilli GitHub Pages portfolyosu."
