  profile_summary: "Yazılıma bir mühendislik sistemi olarak yaklaşıyorum: net sınırlar, okunabilir kod, faydalı soyutlamalar ve ürünün yayın sonrası bakımını kolaylaştıran teslim alışkanlıkları. Ana gücüm .NET ile backend ve API geliştirme; güncel gelişim odağım ise AI uygulamaları, geliştirici araçları ve yapısal otomasyon."
  contact_summary: "Backend, full-stack ve AI destekli ürün mühendisliği odaklı görüşmelere açığım."
  availability: "Yazılım mühendisliği rolleri, ürün iş birlikleri ve teknik danışmanlık için uygunum."
  highlights:
    - ".NET ve ASP.NET Core ile API odaklı backend geliştirme"
    - "SQL, LINQ, PL/SQL ve GraphQL ile veri yoğun ürün geliştirme"
    - "Bakımı kolay frontend sınırlarıyla React tabanlı full-stack teslim"
    - "Üretim mühendisliğinin yanında aktif odak alanı olarak AI / MCP / LLM araçları"
    - "Teknik kararları ve uygulama kalıplarını görünür kılan teknik yazım disiplini"
  experience:
    - title: "Yazılım Mühendisliği Odağı"
      meta: "Backend, full-stack ve sürdürülebilir ürün geliştirme"
      description: "Uygulama katmanları, API'ler, veri modelleri ve frontend akışlarını okunabilirlik, test edilebilirlik ve uzun vadeli bakım odağıyla tasarlama."
    - title: "AI Araçları ve Agentic İş Akışları"
      meta: "Aktif gelişim alanı"
      description: "LLM uygulama geliştirme, MCP entegrasyonları, agentic iş akışları ve mühendislik verimini artıran prompt odaklı araçlar üzerinde çalışmak."
