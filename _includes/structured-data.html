{% assign lang = include.lang | default: site.lang | default: "en" %}
{% assign profile = site.data.profile[lang] %}
{% if page.layout == "post" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": {{ profile.name | jsonify }},
      "item": {% if lang == "tr" %}{{ '/tr/' | absolute_url | jsonify }}{% else %}{{ '/' | absolute_url | jsonify }}{% endif %}
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": {% if lang == "tr" %}"Teknik Notlar"{% else %}"Technical Notes"{% endif %},
      "item": {% if lang == "tr" %}{{ '/tr/blog/' | absolute_url | jsonify }}{% else %}{{ '/blog/' | absolute_url | jsonify }}{% endif %}
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.title | jsonify }},
      "item": {{ page.url | absolute_url | jsonify }}
    }
  ]
}
</script>
{% elsif page.layout == "home" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": ["ProfilePage", "WebPage"],
      "@id": {{ page.url | absolute_url | append: "#profile" | jsonify }},
      "url": {{ page.url | absolute_url | jsonify }},
      "name": {{ page.title | jsonify }},
      "inLanguage": {{ lang | jsonify }},
      "mainEntity": {
        "@id": {{ site.url | append: "/#ferhat-acar" | jsonify }}
      }
    },
    {
      "@type": "Person",
      "@id": {{ site.url | append: "/#ferhat-acar" | jsonify }},
      "name": {{ profile.name | jsonify }},
      "jobTitle": {{ profile.job_title | default: profile.role | jsonify }},
      "description": {{ profile.hero_summary | jsonify }},
      "email": {{ profile.email | prepend: "mailto:" | jsonify }},
      "url": {{ site.url | append: "/" | jsonify }},
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "TR"
      },
      "sameAs": {{ site.social.links | jsonify }},
      "knowsLanguage": ["Turkish", "English"],
      "hasOccupation": {
        "@type": "Occupation",
        "name": {{ profile.job_title | default: profile.role | jsonify }}
      },
      "knowsAbout": [
        "Software Engineering",
        ".NET",
        "C#",
        "Python",
        "Artificial Intelligence",
        "AI Agents",
        "LLM Applications",
        "Model Context Protocol",
        "Backend Development",
        "Industrial Software",
        "Automation"
      ]
    }
  ]
}
</script>
{% endif %}
